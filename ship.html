<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Kahoa Ship</title>
<link rel="apple-touch-icon" href="/ship-icon.png"><link rel="icon" href="/ship-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kahoa Ship"><meta name="theme-color" content="#1f4d2e">
<style>
body{font-family:-apple-system,Segoe UI,Arial,sans-serif;background:#f6f1ea;margin:0;padding:16px;color:#2a2118}
h1{font-size:20px;margin:0 0 4px}.sub{color:#6b5a48;font-size:13px;margin-bottom:14px}
.c{background:#fff;border-radius:10px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.c.done{opacity:.6}.n{font-weight:700}.m{font-size:13px;color:#6b5a48;margin-top:2px}
button{background:#1f4d2e;color:#fff;border:0;border-radius:8px;padding:11px 16px;font-size:15px;font-weight:600;margin-top:10px}
button.g{background:#e8dfd3;color:#2a2118}button:disabled{opacity:.5}
label{display:block;margin:8px 0;font-size:15px}select,input[type=text],input[type=password]{width:100%;box-sizing:border-box;padding:10px;font-size:16px;border:1px solid #cdbfae;border-radius:8px;margin-top:4px}
.err{color:#b3261e;font-size:14px;margin-top:8px}.ok{color:#1f4d2e;font-weight:700}.hide{display:none}
#labels{display:none}
.lbl{width:4in;height:6in;background:#fff;border:2px solid #000;border-radius:14px;padding:.14in .18in;margin:10px auto;display:flex;flex-direction:column;page-break-after:always;overflow:hidden;color:#000}
.lbl .logo{width:100%;height:auto;display:block;margin-bottom:2px}
.lbl .sec{border-top:2px solid #000;padding:5px 0 4px}.lbl .lb{font-weight:800;font-size:11pt}
.lbl .nm{font-weight:800;font-size:19pt;line-height:1.1}.lbl .ad{font-family:Georgia,serif;font-size:14pt;line-height:1.2}
.lbl .pv{font-weight:700;font-size:13pt;line-height:1.15}.lbl .q{font-weight:800;font-size:20pt}.lbl .q small{font-size:12pt}
.lbl .nt{font-size:10pt;font-weight:700;margin-top:3px}
.lbl .ft{border-top:2px solid #000;margin-top:auto;padding-top:8px;display:flex;align-items:center;justify-content:space-between}
.lbl .paid{background:#000;color:#fff;font-weight:900;font-size:20pt;padding:6px 14px;border-radius:8px}
.lbl .ty{font-family:Georgia,serif;font-style:italic;font-weight:700;font-size:11pt;text-align:center;line-height:1.2}
@page{size:4in 6in;margin:0}
@media print{body{background:#fff;padding:0}#app{display:none}#labels{display:block}.lbl{margin:0 auto;border-radius:0}}
</style></head><body>
<div id="app">
<h1>Orders to ship</h1>
<div class="sub">Tap an order, choose how it's going out, send. The customer is emailed and the sheet is updated.</div>
<div id="keybox" class="c hide"><b>Enter your private key</b> <span class="m">(once per phone)</span><input type="password" id="key" placeholder="Private key" autocomplete="off"><input type="text" id="apiurl" placeholder="Script link (optional, ends in /exec)" autocomplete="off" style="margin-top:8px"><button onclick="saveKey()">Save</button></div>
<div id="top" class="hide"><button class="g" onclick="printAll()">Print all Austin labels</button> <button class="g" onclick="load()">Refresh</button> <button class="g" onclick="forgetKey()">Sign out</button></div>
<div id="list">Loading…</div>
</div>
<div id="labels"></div>
<script>

var ORDERS=[];
function E(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function K(){try{return localStorage.getItem('kahoa_ship_key')||''}catch(e){return ''}}
function saveKey(){var v=document.getElementById('key').value.trim(),u=document.getElementById('apiurl').value.trim();if(!v)return;try{localStorage.setItem('kahoa_ship_key',v);if(/^https:\/\/script\.google\.com\/macros\/s\/[^?\s]+\/exec$/.test(u))localStorage.setItem('kahoa_ship_api',u)}catch(e){}load()}
function forgetKey(){try{localStorage.removeItem('kahoa_ship_key');localStorage.removeItem('kahoa_ship_api')}catch(e){}location.reload()}
function show(msg,isErr){document.getElementById('list').innerHTML='<div class="'+(isErr?'err':'m')+'">'+E(msg)+'</div>'}
function load(){
  var key=K();
  document.getElementById('keybox').className=key?'hide':'c';
  document.getElementById('top').className=key?'':'hide';
  if(!key){show('');return}
  show('Loading…');
  fetch(api()+'?api=orders&k='+encodeURIComponent(key)).then(function(r){return r.json()}).then(function(d){
    if(!d.ok){if(/authorized/i.test(d.error||'')){forgetKey();return}show(d.error||'Something went wrong.',true);return}
    ORDERS=d.orders.filter(function(o){return !/^\s*events?\s*:/i.test(o.product)&&!/guests/i.test(o.total)});draw(ORDERS);
  }).catch(function(){show("Couldn't reach the Kahoa script. Check your signal, and that the script is deployed with access set to Anyone.",true)});
}
function draw(a){
  var el=document.getElementById('list');if(!a.length){el.innerHTML='<div class="m">No recent orders.</div>';return}
  var open=a.filter(function(o){return !o.status}),done=a.filter(function(o){return o.status});
  var h=open.length?'':'<div class="c">All caught up ✓ Nothing waiting to ship.</div>';
  open.concat(done).forEach(function(o){var d=!!o.status;
    h+='<div class="c'+(d?' done':'')+'" id="c'+o.row+'"><div class="n">'+E(o.name)+' · '+E(o.total)+'</div><div class="m">'+E(o.product)+(o.grind?' · '+E(o.grind):'')+'</div><div class="m">'+E(o.address)+'</div><div class="m">'+E(o.when)+' · '+E(o.email)+'</div>';
    if(d){h+='<div class="m"><span class="ok">'+E(o.status)+'</span> '+E(o.shippedOn)+(o.tracking?' · '+E(o.tracking):'')+'</div>'}
    else{h+='<button class="g" onclick="printOne('+o.row+')">Print label</button> <button onclick="openF('+o.row+')">Ship this order</button><div class="hide" id="f'+o.row+'">'+form(o)+'</div>'}
    h+='</div>'});
  el.innerHTML=h;
}
function form(o){var r=o.row;return '<label><input type="radio" name="m'+r+'" value="carrier" checked onchange="sw('+r+')"> Ship with a carrier (tracking)</label><label><input type="radio" name="m'+r+'" value="local" onchange="sw('+r+')"> Austin delivery (I drop it off)</label><label><input type="radio" name="m'+r+'" value="pickup" onchange="sw('+r+')"> Pickup</label><div id="k'+r+'"><select id="ca'+r+'"><option>USPS</option><option>UPS</option><option>FedEx</option></select><input type="text" id="t'+r+'" placeholder="Tracking number" autocapitalize="characters"></div><input type="text" id="n'+r+'" placeholder="Optional note (e.g. delivering Thursday evening)" style="margin-top:8px"><label><input type="checkbox" id="x'+r+'"> Don\'t email — just mark it done</label><button id="b'+r+'" onclick="go('+r+')">Send shipped email</button><div class="err" id="e'+r+'"></div>'}
function openF(r){var f=document.getElementById('f'+r);f.className='';f.scrollIntoView({behavior:'smooth',block:'center'})}
function mv(r){var x=document.getElementsByName('m'+r);for(var i=0;i<x.length;i++)if(x[i].checked)return x[i].value}
function sw(r){document.getElementById('k'+r).className=mv(r)=='carrier'?'':'hide';document.getElementById('n'+r).placeholder=mv(r)=='pickup'?'Pickup details: where and when (required)':'Optional note (e.g. delivering Thursday evening)'}
function go(r){
  var o=ORDERS.filter(function(x){return x.row===r})[0],b=document.getElementById('b'+r),e=document.getElementById('e'+r);
  e.textContent='';b.disabled=true;b.textContent='Sending…';
  var p={k:K(),row:r,email:o.email,method:mv(r),carrier:document.getElementById('ca'+r).value,tracking:document.getElementById('t'+r).value,note:document.getElementById('n'+r).value,noEmail:document.getElementById('x'+r).checked};
  fetch(api(),{method:'POST',body:JSON.stringify(p)}).then(function(r){return r.json()}).then(function(d){
    if(d.ok){var c=document.getElementById('c'+r);c.className='c done';c.innerHTML='<div class="ok">✓ Done'+(p.noEmail?'':' — customer emailed')+'.</div>'}
    else{e.textContent=d.error||'Failed.';b.disabled=false;b.textContent='Send shipped email'}
  }).catch(function(){e.textContent="Couldn't reach the script. Check your signal and try again. It may not have sent, so check the sheet before retrying.";b.disabled=false;b.textContent='Send shipped email'});
}
/* ---- labels (4x6) ---- */
function parseItems(product,grind){
  var parts=String(product).replace(/\s*\+\s*sales tax\s*\([^)]*\)/ig,'').replace(/\s*\[(local delivery|pickup|shipping)\]/ig,'').trim().split(';').map(function(x){return x.trim()}).filter(String);
  var items=parts.map(function(p){var m=p.match(/^(\d+)\s*[x×*]\s*(.+)$/i),qty=m?Number(m[1]):1,rest=m?m[2]:p,g='';
    var gm=rest.match(/[\[(]([^\])]+)[\])]\s*$/);if(gm){g=gm[1];rest=rest.replace(/\s*[\[(][^\])]+[\])]\s*$/,'')}
    return{qty:qty,name:rest.trim(),grind:g}});
  if(items.length===1&&!items[0].grind&&grind&&!/n\/a|none|see items|mixed|^sample$/i.test(grind))items[0].grind=grind;
  return items}
function splitAddr(a){a=String(a);var note='',m=a.match(/\s*[—-]+\s*DELIVERY NOTE:\s*([\s\S]*)$/i);
  if(m){note=m[1].trim();a=a.replace(m[0],'')}
  var p=a.match(/^(.*),\s*([^,]+),\s*([A-Za-z]{2,})\s+([\d-]+)\s*$/);
  return p?{l1:p[1].trim(),l2:p[2].trim()+', '+p[3].toUpperCase().slice(0,2)+' '+p[4],note:note}:{l1:a.trim(),l2:'',note:note}}
function labelHtml(o){
  var items=parseItems(o.product,o.grind),bags=items.reduce(function(n,i){return n+i.qty},0),ad=splitAddr(o.address),free=/^\$?0(\.00)?$/.test(String(o.total).trim());
  var prods=items.map(function(i,k){return '<div class="sec"><div class="lb">PRODUCT '+(k+1)+':</div><div class="pv">'+(i.qty>1?i.qty+'× ':'')+E(i.name)+(i.grind?' ('+E(i.grind)+')':'')+'</div></div>'}).join('');
  var qty=bags+(bags===1?' Bag':' Bags')+(items.length>1&&items.every(function(i){return i.qty===1})?' <small>(1 of each)</small>':'');
  return '<div class="lbl"><img class="logo" src="data:image/png;base64,'+LOGO+'"><div class="sec"><div class="lb">NAME:</div><div class="nm">'+E(o.name)+'</div></div><div class="sec"><div class="lb">SHIP TO:</div><div class="ad">'+E(ad.l1)+'<br>'+E(ad.l2)+'</div>'+(ad.note?'<div class="nt">NOTE: '+E(ad.note)+'</div>':'')+'</div>'+prods+'<div class="sec"><div class="lb">QUANTITY:</div><div class="q">'+qty+'</div></div><div class="ft"><div class="paid">'+(free?'✓ FREE ORDER':'✓ PAID')+'</div><div class="ty">Thank you for being<br>part of the Kahoa family!</div></div></div>'}
function printLabels(sel){if(!sel.length){alert('No matching orders to print.');return}
  document.getElementById('labels').innerHTML=sel.map(labelHtml).join('');setTimeout(function(){window.print()},150)}
function printOne(r){printLabels(ORDERS.filter(function(o){return o.row===r}))}
function printAll(){printLabels(ORDERS.filter(function(o){return !o.status&&/austin/i.test(o.address)}))}
load();
</script></body></html>
