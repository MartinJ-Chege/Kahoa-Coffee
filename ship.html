<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Kahoa Team</title>
<link rel="apple-touch-icon" href="/ship-icon.png"><link rel="icon" href="/ship-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kahoa Team"><meta name="theme-color" content="#2b1810">
<style>
body{font-family:-apple-system,Segoe UI,Arial,sans-serif;background:#f6f1ea;margin:0;padding:0 0 40px;color:#2a2118}
h1{font-size:20px;margin:0 0 4px}.sub{color:#6b5a48;font-size:13px;margin-bottom:14px}
.c{background:#fff;border-radius:10px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.c.done{opacity:.6}.n{font-weight:700}.m{font-size:13px;color:#6b5a48;margin-top:2px}
button{background:#1f4d2e;color:#fff;border:0;border-radius:8px;padding:11px 16px;font-size:15px;font-weight:600;margin-top:10px}
button.g{background:#e8dfd3;color:#2a2118}button:disabled{opacity:.5}
label{display:block;margin:8px 0;font-size:15px}select,input[type=text],input[type=password]{width:100%;box-sizing:border-box;padding:10px;font-size:16px;border:1px solid #cdbfae;border-radius:8px;margin-top:4px}
.err{color:#b3261e;font-size:14px;margin-top:8px}.ok{color:#1f4d2e;font-weight:700}.hide{display:none}
#labels{position:absolute;left:-10000px;top:0}
.lbl,.lbl *{box-sizing:border-box}
.lbl{width:4in;height:6in;background:#fff;border:2px solid #000;border-radius:14px;padding:.12in .16in .1in;margin:10px auto;display:flex;flex-direction:column;page-break-after:always;overflow:hidden;color:#000;font-family:Arial,Helvetica,sans-serif}
.lbl .logo{width:100%;height:auto;display:block}
.lbl .rule{border-top:2px solid #000}
.lbl .mid{flex:1;display:flex;min-height:0}
.lbl .left{flex:1;min-width:0}
.lbl .vb{position:relative;width:.52in;flex:none}
.lbl .vbin{position:absolute;top:0;left:0;transform-origin:top left}
.lbl .vbin svg,.lbl .hb svg{display:block;width:100%;height:100%}
.lbl .vnum{position:absolute;right:0;top:0;height:100%;writing-mode:vertical-rl;font-size:9pt;letter-spacing:3px;display:flex;justify-content:center;align-items:center}
.lbl .sec{border-top:2px solid #000;padding:4px 0 3px}.lbl .left .sec:first-child{border-top:0}
.lbl .lb{font-weight:800;font-size:10.5pt}
.lbl .nm{font-weight:800;font-size:19pt;line-height:1.08}
.lbl .ad{font-family:Georgia,serif;font-size:14pt;line-height:1.15}
.lbl .pv{font-weight:700;font-size:12.5pt;line-height:1.12}
.lbl .q{font-weight:800;font-size:21pt;line-height:1.1}.lbl .q small{font-size:12pt}
.lbl .nt{font-size:10pt;font-weight:700;margin-top:3px}
.lbl.sm .pv{font-size:10.5pt}.lbl.sm .nm{font-size:16pt}.lbl.sm .ad{font-size:12pt}.lbl.sm .q{font-size:16pt}
.lbl .ft{border-top:2px solid #000;display:flex;align-items:center;justify-content:space-between;padding:6px 0}
.lbl .paid{background:#000;color:#fff;font-weight:900;font-size:21pt;padding:4px 14px 4px 8px;border-radius:8px;display:flex;align-items:center;gap:7px}
.lbl .paid svg{width:.3in;height:.3in;flex:none}
.lbl .ty{font-family:Georgia,serif;font-style:italic;font-weight:700;font-size:11.5pt;text-align:center;line-height:1.15;padding-bottom:6px;position:relative}
.lbl .ty svg{position:absolute;left:8%;bottom:0;width:84%;height:6px}
.lbl .bot{border-top:2px solid #000;padding-top:5px}
.lbl .hb{height:.55in}
.lbl .hnum{text-align:center;font-size:14pt;letter-spacing:5px;margin-top:2px;font-weight:500}
@page{size:4in 6in;margin:0}
@media print{body{background:#fff;padding:0}#app{display:none}#labels{position:static}.lbl{margin:0 auto;border-radius:0}}

#app{max-width:640px;margin:0 auto}
.hd{background:#2b1810;color:#fff;padding:14px 16px 0;position:sticky;top:0;z-index:5}
.hd .ttl{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}.hd .ttl small{color:#D4A843;font-weight:600;font-size:12px;letter-spacing:1px;text-transform:uppercase}
.tabs{display:flex;gap:4px;margin-top:10px}.tabs button{flex:1;background:transparent;color:rgba(255,255,255,.7);border-radius:8px 8px 0 0;margin:0;padding:10px 4px;font-size:14px}
.tabs button.on{background:#f6f1ea;color:#2b1810}
.wrap{padding:14px 16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nm-b{background:#fff;color:#2a2118;border:2px solid #e3d6c4;border-radius:12px;padding:16px 10px;margin:0;text-align:center;display:flex;flex-direction:column;gap:4px;font-size:17px}
.nm-b small{font-size:12px;font-weight:500;color:#8a7864}.nm-b.on{border-color:#2f7a45;background:#eef7f0}.nm-b.on small{color:#2f7a45;font-weight:700}
.hi{font-size:22px;font-weight:800}
button.big{width:100%;padding:15px;font-size:17px;margin-top:12px}button.go{background:#2f7a45}button.stop{background:#a2462a}
button.link{background:none;color:#7a4a22;padding:4px 0;margin:6px 0 0;text-decoration:underline;font-weight:600;font-size:14px}
input[type=date],input[type=datetime-local],input[type=number],textarea,select{width:100%;box-sizing:border-box;padding:10px;font-size:16px;border:1px solid #cdbfae;border-radius:8px;margin-top:6px;background:#fff;font-family:inherit}
input[type=text],input[type=password]{margin-top:8px}
.done-big{font-size:18px;font-weight:700;color:#2f7a45;text-align:center;padding:28px 16px}
.who{font-size:14px;margin-bottom:10px;color:#6b5a48}.tiny{font-size:11.5px;margin-top:8px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}.row2{display:flex;gap:8px;align-items:center;margin-top:8px}.row2>*{margin-top:0!important}.row2>input,.row2>select{flex:1;min-width:0;width:auto}.row2 button{margin:0;white-space:nowrap}
.pre{white-space:pre-wrap;margin:6px 0;font-size:15px}
.st{font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px;background:#eee}.st-new{background:#fdf1dc;color:#8a4b14}.st-approved{background:#e7f1fb;color:#1f5b8a}.st-ordered{background:#efe9fb;color:#5b3a9a}.st-done{background:#eef7f0;color:#2f7a45}.st-declined{background:#fbecea;color:#a2462a}
h3{font-size:15px;margin:16px 0 8px}
.sub-tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.sub-tabs button{background:#e8dfd3;color:#2a2118;margin:0;font-size:14px;padding:9px 12px}.sub-tabs button.on{background:#2b1810;color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{background:#f1e9dd;color:#2a2118;margin:0;padding:8px 12px;font-size:13px;border-radius:20px}.chip.on{background:#D4A843;color:#2b1810}
.tb{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}.tb th{text-align:left;font-size:12px;color:#8a7864;font-weight:600;border-bottom:1px solid #e3d6c4;padding:6px 4px}.tb td{padding:7px 4px;border-bottom:1px solid #f1e9dd}.tb tr.tt td{border-top:2px solid #2b1810;font-weight:700}
.shift{border-top:1px solid #f1e9dd;padding:10px 0}.shift:first-of-type{border-top:0}
.warn{color:#a2462a;font-weight:700}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2f7a45}
.foot-admin{text-align:center;margin-top:24px}
</style></head><body>

</div></div>

var API='https://kahoa-checkoutout.chegekibuthu1.workers.dev/staff/';
var TZ='America/Chicago',PEOPLE=[],ORDERS=[],U=null,ADM=null,CUR_TAB='clock',SEL=null;
function E(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function $(i){return document.getElementById(i)}
function call(a,b){return fetch(API+a,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})}).then(function(r){return r.json()}).catch(function(){return{ok:false,error:"Couldn't connect. Check your signal and try again."}})}
function t(ms){return new Date(ms).toLocaleTimeString('en-US',{timeZone:TZ,hour:'numeric',minute:'2-digit'})}
function dt(ms){return new Date(ms).toLocaleString('en-US',{timeZone:TZ,weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}
function day(ms){return new Date(ms).toLocaleDateString('en-US',{timeZone:TZ,weekday:'short',month:'short',day:'numeric'})}
function hrs(h){return (Math.round(h*100)/100).toFixed(2)+' h'}
function money(n){return '$'+Number(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',')}
function ymd(d){return d.toLocaleDateString('en-CA',{timeZone:TZ})}
function localInput(ms){var d=new Date(ms);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)}
function tab(n){CUR_TAB=n;['clock','ship','supplies','admin'].forEach(function(x){$('v-'+x).className=x===n?'':'hide';var b=$('t-'+x);if(b)b.className=x===n?'on':''});
  if(n==='clock')loadPeople();if(n==='ship')renderShip();if(n==='supplies')renderSupplies();if(n==='admin')renderAdmin();window.scrollTo(0,0)}

/* ---------- who are you (name + code) ---------- */
function nameOptions(sel,adminOnly){return '<option value="">Choose your name</option>'+PEOPLE.map(function(p){return '<option value="'+p.id+'"'+(sel==p.id?' selected':'')+'>'+E(p.name)+'</option>'}).join('')}
function unlockBox(where,title,onok){
  $(where).innerHTML='<div class="c"><div class="n">'+title+'</div><select id="'+where+'-p">'+nameOptions()+'</select><input type="password" inputmode="numeric" autocomplete="off" id="'+where+'-c" placeholder="Your code" maxlength="8"><button class="big" id="'+where+'-b">Continue</button><div class="err" id="'+where+'-e"></div></div>';
  if(!PEOPLE.length)loadPeople(function(){var s=$(where+'-p');if(s)s.innerHTML=nameOptions()});
  $(where+'-b').onclick=function(){var pid=$(where+'-p').value,code=$(where+'-c').value.trim(),e=$(where+'-e');e.textContent='';
    if(!pid){e.textContent='Choose your name.';return}if(!code){e.textContent='Type your code.';return}
    this.disabled=true;var btn=this;call('check',{person_id:+pid,code:code}).then(function(d){btn.disabled=false;
      if(!d.ok){e.textContent=d.error||'Try again.';return}onok({id:+pid,code:code,name:d.person.name,is_admin:d.person.is_admin,check:d})})}}
function whoBar(u,reset){return '<div class="who">Signed in as <b>'+E(u.name)+'</b> <button class="link" onclick="'+reset+'">Not you?</button></div>'}

/* ---------- clock ---------- */
function loadPeople(cb){call('people').then(function(d){if(!d.ok){$('names').innerHTML='<div class="err">'+E(d.error||'Could not load the team.')+'</div>';return}
  PEOPLE=d.people||[];if(CUR_TAB==='clock'&&!SEL)drawNames();if(cb)cb()})}
function drawNames(){var el=$('names');if(!PEOPLE.length){el.innerHTML='<div class="m">No team members yet. Martin adds them in Admin.</div>';return}

  var prods=items.map(function(i,k){return '<div class="sec"><div class="lb">PRODUCT '+(k+1)+':</div><div class="pv">'+(i.qty>1?i.qty+'× ':'')+E(i.name)+(i.grind?' ('+E(i.grind)+')':'')+'</div></div>'}).join('');
  var qty=bags+(bags===1?' Bag':' Bags')+(items.length>1&&items.every(function(i){return i.qty===1})?' <small>(1 of each)</small>':'');
  var check='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#fff"/><path d="M6.5 12.5l3.8 3.8 7.4-8" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var swoosh='<svg viewBox="0 0 100 6" preserveAspectRatio="none"><path d="M0 5 Q50 -2 100 4" fill="none" stroke="#000" stroke-width="1.6"/></svg>';
  return '<div class="lbl'+(items.length>2?' sm':'')+'" data-no="'+no+'"><img class="logo" src="data:image/png;base64,'+LOGO+'"><div class="rule"></div>'+
   '<div class="mid"><div class="left"><div class="sec"><div class="lb">NAME:</div><div class="nm">'+E(o.name)+'</div></div>'+
   '<div class="sec"><div class="lb">SHIP TO:</div><div class="ad">'+E(ad.l1)+'<br>'+E(ad.l2)+'</div>'+(ad.note?'<div class="nt">NOTE: '+E(ad.note)+'</div>':'')+'</div>'+
   prods+'<div class="sec"><div class="lb">QUANTITY:</div><div class="q">'+qty+'</div></div></div>'+
   '<div class="vb"><div class="vbin"><svg class="bcv"></svg></div><div class="vnum">'+no+'</div></div></div>'+
   '<div class="ft"><div class="paid">'+check+(free?'FREE':'PAID')+'</div><div class="ty">Thank you for being<br>part of the Kahoa family!'+swoosh+'</div></div>'+
   '<div class="bot"><div class="hb"><svg class="bch"></svg></div><div class="hnum">'+no+'</div></div></div>'}
function drawBarcodes(){
  var ls=document.querySelectorAll('#labels .lbl');
  for(var i=0;i<ls.length;i++){var l=ls[i],no=l.getAttribute('data-no');
    if(typeof JsBarcode==='function'){
      ['.bcv','.bch'].forEach(function(q){var sv=l.querySelector(q);try{JsBarcode(sv,no,{format:'CODE128',displayValue:false,margin:0,width:2,height:60});
        sv.setAttribute('viewBox','0 0 '+String(sv.getAttribute('width')).replace('px','')+' 60');sv.setAttribute('preserveAspectRatio','none');sv.removeAttribute('width');sv.removeAttribute('height')}catch(e){}});
    }
    var vb=l.querySelector('.vb'),inn=l.querySelector('.vbin'),h=vb.clientHeight,w=Math.round(vb.clientWidth*0.62);
    inn.style.width=h+'px';inn.style.height=w+'px';inn.style.transform='translateX('+w+'px) rotate(90deg)';
  }}
function printLabels(sel){if(!sel.length){alert('No matching orders to print.');return}
  document.getElementById('labels').innerHTML=sel.map(labelHtml).join('');
  setTimeout(function(){drawBarcodes();setTimeout(function(){window.print()},150)},100)}
function printOne(r){printLabels(ORDERS.filter(function(o){return o.row===r}))}
function printAll(){printLabels(ORDERS.filter(function(o){return !o.status&&/austin/i.test(o.address)}))}

loadPeople();
</script></body></html>
