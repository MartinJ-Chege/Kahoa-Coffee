<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Contractor File · Kahoa</title>
<link rel="icon" href="/ship-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--brown:#2b1810;--mid:#5A2E1A;--muted:#8B6040;--gold:#D4A843;--soft:#F1E7D6;--line:#EADFCD}
*{box-sizing:border-box}
body{margin:0;background:#EFE7DA;color:#1C0E06;font-family:Montserrat,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;line-height:1.55}
.bar{position:sticky;top:0;background:var(--brown);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;gap:10px;z-index:2}
.bar b{font-weight:600}.bar button{background:var(--gold);color:var(--brown);border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer}
.page{background:#fff;max-width:8.5in;margin:18px auto;padding:.7in .75in;box-shadow:0 6px 24px rgba(0,0,0,.12)}
.logo{display:block;width:210px;margin:0 auto 6px}
.rule{height:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:10px 0 18px}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-size:26px;text-align:center;margin:0;color:var(--brown);letter-spacing:.5px}
.co{text-align:center;color:var(--muted);font-size:12px;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px}
p{margin:0 0 9px}p b{color:var(--brown)}
.sign{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:22px;page-break-inside:avoid}
.sigbox{border-bottom:1.5px solid #1C0E06;height:90px;display:flex;align-items:flex-end}.sigbox img{max-height:86px;max-width:100%}
.kahoa-sig{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:30px;color:var(--brown);padding-bottom:4px}
.cap{font-size:12px;color:var(--muted);margin-top:4px}.cap b{color:#1C0E06;display:block;font-size:13px}
table{width:100%;border-collapse:collapse;margin-top:20px;font-size:12.5px;page-break-inside:avoid}td{padding:6px 8px;border:1px solid var(--line);vertical-align:top}td:first-child{width:32%;background:#FAF5EC;color:var(--mid);font-weight:600}
.w9 h2{font-family:'Cormorant Garamond',Georgia,serif;font-size:24px;margin:0 0 10px;color:var(--brown)}.w9 img{width:100%;max-height:9in;object-fit:contain;border:1px solid var(--line)}
.w9 a{color:var(--mid);font-weight:700}
.msg{max-width:520px;margin:60px auto;text-align:center;color:var(--muted)}
.warn{background:#FDF1DC;border:1px solid #E9C98A;border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:13px}
@page{size:letter;margin:.5in}
@media print{body{background:#fff}.bar{display:none}.page{box-shadow:none;margin:0;max-width:none;padding:0}.w9{page-break-before:always}.noprint{display:none}}
</style></head><body>
<div class="bar"><b id="who">Contractor file</b><button onclick="window.print()">Print or save PDF</button></div>
<div id="out"><p class="msg">Loading…</p></div>
<script>
(function(){
  var API='https://kahoa-checkoutout.chegekibuthu1.workers.dev/staff/',TZ='America/Chicago',out=document.getElementById('out');
  function E(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function when(ms){return new Date(ms).toLocaleString('en-US',{timeZone:TZ,month:'long',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'})+' Central'}
  var me=null;try{me=JSON.parse(localStorage.getItem('kahoa_team_me')||'null')}catch(e){}
  var pid=Number((location.search.match(/[?&]p=(\d+)/)||[])[1]);
  if(!me||!me.token){out.innerHTML='<p class="msg">Open this from the Kahoa Team page on your phone: <a href="/team">kahoa.shop/team</a></p>';return}
  var own=!(me.is_admin&&pid);
  fetch(API+(own?'my_file':'admin'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(own?{person_id:me.id,token:me.token}:{person_id:me.id,token:me.token,op:'file',staff_id:pid})}).then(function(r){return r.json()}).then(function(d){
    if(!d.ok){out.innerHTML='<p class="msg">'+E(d.error||'Could not load this file.')+'</p>';return}
    var p=d.person,a=d.agreement,h='';document.getElementById('who').textContent=d.own?'Your contractor agreement':p.name+' · contractor file';document.title=d.own?'My Kahoa agreement':p.name+' · Kahoa contractor file';
    if(!a&&d.own){out.innerHTML='<p class="msg">You haven\'t signed your agreement yet. Open <a href="/team">kahoa.shop/team</a> to sign it.</p>';return}
    if(!a){h+='<div class="page"><p class="msg" style="margin:20px auto">'+E(p.name)+' has not signed the contractor agreement yet. They\'ll be asked to the next time they open Kahoa Team.</p></div>'}
    else{
      var parts=a.text.split('\n\n'),body=parts.slice(2,-1),acc=parts[parts.length-1];
      h+='<div class="page"><img class="logo" src="/kahoa-logo-transparent.png" alt="Kahoa"><div class="co">Kahoa Coffee LLC · Austin, Texas</div><h1>Independent Contractor Agreement</h1><div class="rule"></div>'+
        (a.version!==d.current_version&&!d.own?'<div class="warn noprint">This was signed on an older version of the agreement ('+E(a.version)+'). They will be asked to sign the new one.</div>':'')+
        body.map(function(x){return '<p>'+E(x).replace(/^(\d+\.\s[^.]+\.)/,'<b>$1</b>')+'</p>'}).join('')+
        '<div class="sign"><div><div class="sigbox"><img src="'+a.sig+'" alt="Signature"></div><div class="cap"><b>'+E(a.legal_name)+'</b>Contractor · signed electronically '+E(when(a.signed_at))+'</div></div>'+
        '<div><div class="sigbox"><span class="kahoa-sig">Martin Kibuthu</span></div><div class="cap"><b>Kahoa Coffee LLC</b>By Martin Kibuthu, Founder · '+E(acc.replace(/^.*Accepted electronically on /,'accepted electronically on ').replace(/\.$/,''))+'</div></div></div>'+
        '<table><tr><td>Legal name</td><td>'+E(a.legal_name)+'</td></tr><tr><td>Mailing address</td><td>'+E(a.address)+'</td></tr><tr><td>Email</td><td>'+E(a.email)+'</td></tr>'+
        '<tr><td>Rate at signing</td><td>$'+(a.rate_cents/100).toFixed(2)+' per hour</td></tr>'+(d.pay?'<tr><td>Paid by</td><td>'+E({cashapp:'Cash App $',venmo:'Venmo @',paypal:'PayPal.me/',zelle:'Zelle '}[d.pay.method]||'')+E(d.pay.handle)+'</td></tr>':'')+
        '<tr><td>Signed</td><td>'+E(when(a.signed_at))+'</td></tr>'+(d.own?'':'<tr><td>Signing record</td><td>Agreement '+E(a.version)+' · IP '+E(a.ip||'n/a')+'<br><span style="color:#8B6040">'+E(a.ua||'')+'</span></td></tr>')+'</table></div>';
    }
    if(d.own){out.innerHTML=h;return}
    {
    }
    h+='<div class="page w9"><h2>Form W-9</h2>';
    if(!d.w9)h+='<p style="color:#8B6040">No W-9 on file yet. '+E(p.name)+' will see a reminder on their home screen.</p>';
    else if(d.w9.mime==='application/pdf'){var bin=atob(d.w9.file.split(',')[1]),u8=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);var url=URL.createObjectURL(new Blob([u8],{type:'application/pdf'}));
      h+='<p>Uploaded '+E(when(d.w9.uploaded_at))+' as a PDF. <a href="'+url+'" target="_blank" download="'+E(p.name)+'-W9.pdf">Open or download the W-9</a></p>'}
    else h+='<p style="color:#8B6040;font-size:12px">Uploaded '+E(when(d.w9.uploaded_at))+'</p><img src="'+d.w9.file+'" alt="W-9">';
    h+='<p class="noprint" style="font-size:12px;color:#8B6040;margin-top:14px">This file has private tax information. Keep printed copies somewhere safe.</p></div>';
    out.innerHTML=h;
  }).catch(function(){out.innerHTML='<p class="msg">Could not load. Check your connection and refresh.</p>'});
})();
</script>
</body></html>
